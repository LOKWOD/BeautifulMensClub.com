name: Deploy Beautiful Men's Club

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate expanded Beautiful Men's Club library
        run: node scripts/generate-expansion.mjs

      - name: Normalize and verify Cloudflare Web Analytics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          token = "ebb9c435ac06430c9e3f3e6e03e7178b"
          beacon = (
              "<!-- Cloudflare Web Analytics -->"
              "<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' "
              f"data-cf-beacon='{{\"token\": \"{token}\"}}'></script>"
              "<!-- End Cloudflare Web Analytics -->"
          )

          comment_block = re.compile(
              r"<!--\s*Cloudflare Web Analytics\s*-->.*?"
              r"<!--\s*End Cloudflare Web Analytics\s*-->",
              re.IGNORECASE | re.DOTALL,
          )
          standalone_beacon = re.compile(
              r"<script\b[^>]*static\.cloudflareinsights\.com/beacon\.min\.js[^>]*>\s*</script>",
              re.IGNORECASE | re.DOTALL,
          )

          html_files = sorted(Path('.').rglob('*.html'))
          if not html_files:
              raise SystemExit('No HTML files found to publish')

          for path in html_files:
              html = path.read_text(encoding='utf-8')
              html = comment_block.sub('', html)
              html = standalone_beacon.sub('', html)

              if '</body>' not in html:
                  raise SystemExit(f'Missing </body> in {path}')

              html = html.replace('</body>', f'\n  {beacon}\n</body>', 1)
              path.write_text(html, encoding='utf-8')

              if html.count(token) != 1:
                  raise SystemExit(f'Analytics token count is not exactly one in {path}')
              if html.count('static.cloudflareinsights.com/beacon.min.js') != 1:
                  raise SystemExit(f'Analytics beacon count is not exactly one in {path}')

              print(f'Analytics verified: {path}')

          print(f'Cloudflare Web Analytics verified on {len(html_files)} HTML page(s).')
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
