name: Deploy Beautiful Men's Club
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Cloudflare Web Analytics
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = 'Cloudflare Web Analytics'
          beacon = '''<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ebb9c435ac06430c9e3f3e6e03e7178b"}'></script><!-- End Cloudflare Web Analytics -->'''
          for path in Path('.').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              if marker in html:
                  continue
              if '</body>' not in html:
                  raise SystemExit(f'Missing </body> in {path}')
              path.write_text(html.replace('</body>', beacon + '</body>'), encoding='utf-8')
              print(f'Injected analytics: {path}')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4