name: Publish expanded Beautiful Men's Club site

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-expanded-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-expanded-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify site package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .publish/part-000.b64 \
            .publish/part-001.b64 \
            .publish/part-002.b64 \
            .publish/part-003-0.b64 \
            .publish/part-003-1.b64 \
            .publish/part-003-2.b64 \
            .publish/part-003-3.b64 \
            .publish/part-004.b64 \
            > /tmp/beautifulmensclub-package.b64
          test "$(wc -c < /tmp/beautifulmensclub-package.b64)" -eq 42964
          base64 --decode /tmp/beautifulmensclub-package.b64 > /tmp/beautifulmensclub-package.zip
          echo "7effb27d83203934a939f211575ec8e0a7064a3621c780f7a7d9703e78b554d6  /tmp/beautifulmensclub-package.zip" | sha256sum --check
          rm -rf /tmp/beautifulmensclub-package
          mkdir -p /tmp/beautifulmensclub-package
          unzip -q /tmp/beautifulmensclub-package.zip -d /tmp/beautifulmensclub-package
          test -f /tmp/beautifulmensclub-package/site/index.html
          test -f /tmp/beautifulmensclub-package/site/style.html
          test -f /tmp/beautifulmensclub-package/site/grooming.html
          test -f /tmp/beautifulmensclub-package/site/fitness.html
          test -f /tmp/beautifulmensclub-package/site/life.html
          test -f /tmp/beautifulmensclub-package/site/standards.html
          test -f /tmp/beautifulmensclub-package/site/styles.css
          test -f /tmp/beautifulmensclub-package/site/script.js

      - name: Install expanded site
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/beautifulmensclub-package/site/. ./
          rm -rf .publish
          rm -f .github/workflows/publish-expanded-site.yml

      - name: Commit and push finished site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes were needed."
            exit 0
          fi
          git commit -m "Expand Beautiful Men's Club site"
          git push origin HEAD:main
